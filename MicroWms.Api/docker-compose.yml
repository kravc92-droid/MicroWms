
services:
  postgres:
    image: postgres:18
    container_name: microwms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: MicroWms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
