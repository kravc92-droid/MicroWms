services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: MicroWms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MicroWms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WmsDatabase: "Host=postgres;Port=5432;Database=MicroWms;Username=postgres;Password=123"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:26-alpine
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./MicroWms.Web:/app
      - angular_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start -- --host 0.0.0.0"
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  postgres_data:
    external: true
    name: microwms_postgres_data

  angular_node_modules: